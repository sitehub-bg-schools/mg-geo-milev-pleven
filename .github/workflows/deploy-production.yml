name: deploy-production

# Production deploy. Fires when code reaches main (only via a PR from staging)
# and can also be triggered manually. Served at https://mg-geo-milev-pleven.sitehub.bg.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE_URL: https://mg-geo-milev-pleven.sitehub.bg
        run: npm run build
      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mg-geo-milev-pleven-prod --branch=main
